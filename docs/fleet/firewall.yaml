pvecli_firewall: 1
datacenter:
  options:
    enable: 1
  aliases:
  - name: admin-net
    cidr: 10.0.0.0/24
    comment: admins
  ipsets:
  - name: management
    entries:
    - cidr: 10.0.0.7
      comment: admin workstation
  groups:
  - name: webserver
    comment: web servers
    rules:
    - type: in
      action: ACCEPT
      macro: HTTP
      enable: 1
    - type: in
      action: ACCEPT
      macro: HTTPS
      enable: 1
guests:
  890:
    type: vm
    name: web-01
    options:
      enable: 1
    rules:
    - type: group
      action: webserver
      enable: 1
    - type: in
      action: ACCEPT
      macro: SSH
      source: admin-net
      enable: 1
      comment: admins
  891:
    type: ct
    name: dns-01
    options:
      enable: 1
    rules:
    - type: in
      action: ACCEPT
      macro: DNS
      enable: 1
    - type: in
      action: ACCEPT
      macro: SSH
      source: admin-net
      enable: 1
